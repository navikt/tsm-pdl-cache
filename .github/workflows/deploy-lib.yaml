name: Deploy library

on:
  push:
    branches: [main, dev/client-lib]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-lib.yaml'
      - '.release-it.json'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: navikt/tsm-workflows/actions/gradle/setup@main
      - run: ./gradlew :client:build :client:test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: npx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
